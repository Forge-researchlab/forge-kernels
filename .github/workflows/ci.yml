name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted runners have no GPU, so this workflow deliberately checks only
# what is checkable on CPU: lint, syntax, and that the benchmark registry still
# points at files that exist. Kernel correctness and every performance number
# require an A100 and are run by hand — see CONTRIBUTING.md.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check .

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Everything parses
        run: python -m compileall -q benchmarks forge kernels tests

      - name: Benchmark registry resolves
        # bench_all.py --list imports only the standard library, so it runs
        # without torch and will flag any benchmark whose script has moved.
        run: |
          python benchmarks/bench_all.py --list | tee listing.txt
          # A missing script is flagged as "! <name>  <path>". The trailing
          # legend line is "! = script missing from working tree", so require a
          # non-'=' first character to avoid matching the legend itself.
          if grep -qE '^! [^=]' listing.txt; then
            echo "::error::a benchmark script in bench_all.py is missing from the tree"
            exit 1
          fi

      - name: Every package is declared for packaging
        run: python scripts/check_packages_declared.py

      - name: The wheel is importable without the repository
        # The wheel used to ship the patching layer and no kernels, so `import
        # forge` worked in a checkout and failed everywhere else. Build it and
        # import from site-packages with the repo off sys.path. torch is far too
        # heavy for a CPU runner, so this stops at the import boundary: it proves
        # the kernel modules are present and reachable, not that they run.
        run: |
          python -m pip install -q build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install -q --no-deps dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python - <<'PY'
          import importlib.util as u
          for name in ("forge", "forge.patching.core", "kernels.rope.forge_rope_v3",
                       "kernels.lora_mlp.experiments.v6.lora_mlp_kernel_v6",
                       "kernels.lora_mlp.reference.unsloth_baseline",
                       "kernels.cross_entropy.experiments.v2"):
              assert u.find_spec(name) is not None, f"{name} is not in the wheel"
          print("all kernel modules resolve from site-packages")
          PY

      - name: Result files referenced by the README exist
        run: |
          status=0
          while read -r path; do
            [ -e "$path" ] || { echo "::error::README links missing path: $path"; status=1; }
          done < <(grep -oP '\]\(\K[^)#][^)]*' README.md | grep -vE '^https?://' | sed 's/#.*//' | sort -u)
          exit $status
