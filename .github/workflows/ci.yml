name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted runners have no GPU, so this workflow deliberately checks only
# what is checkable on CPU: lint, syntax, and that the benchmark registry still
# points at files that exist. Kernel correctness and every performance number
# require an A100 and are run by hand — see CONTRIBUTING.md.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check .

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Everything parses
        run: python -m compileall -q benchmarks forge kernels tests

      - name: Benchmark registry resolves
        # bench_all.py --list imports only the standard library, so it runs
        # without torch and will flag any benchmark whose script has moved.
        run: |
          python benchmarks/bench_all.py --list | tee listing.txt
          # A missing script is flagged as "! <name>  <path>". The trailing
          # legend line is "! = script missing from working tree", so require a
          # non-'=' first character to avoid matching the legend itself.
          if grep -qE '^! [^=]' listing.txt; then
            echo "::error::a benchmark script in bench_all.py is missing from the tree"
            exit 1
          fi

      - name: Every package is declared for packaging
        run: python scripts/check_packages_declared.py

      - name: The wheel carries the kernels
        # The wheel used to ship the patching layer and no kernels, so `import
        # forge` worked in a checkout and failed everywhere else. Install it and
        # check the kernel modules landed in site-packages.
        #
        # Deliberately a filesystem check rather than an import: importing any
        # forge submodule executes forge/__init__.py, which needs torch, and torch
        # is far too heavy for a CPU runner. That an installed copy actually runs
        # is verified by hand on a GPU — see CONTRIBUTING.md.
        run: |
          python -m pip install -q build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install -q --no-deps dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import pathlib, sysconfig
          site = pathlib.Path(sysconfig.get_paths()["purelib"])
          required = [
              "forge/__init__.py",
              "forge/patching/core.py",
              "forge/patching/kernels/common.py",
              "kernels/rope/forge_rope_v3.py",
              "kernels/rmsnorm/__init__.py",
              "kernels/swiglu/__init__.py",
              "kernels/cross_entropy/experiments/v2/__init__.py",
              "kernels/embedding/experiments/v1/embedding_kernel_v1_upgrade_1.py",
              "kernels/lora_mlp/experiments/v6/lora_mlp_kernel_v6.py",
              # Imported at runtime by LoRA MLP v5/v6, so it has to ship.
              "kernels/lora_mlp/reference/unsloth_baseline.py",
              "kernels/lora_qkv/experiments/v4/lora_qkv_kernel_v4.py",
          ]
          missing = [name for name in required if not (site / name).is_file()]
          for name in missing:
              print(f"::error::{name} is missing from the installed wheel")
          raise SystemExit(1 if missing else 0)
          PY
          echo "all kernel modules present in site-packages"

      - name: Result files referenced by the README exist
        run: |
          status=0
          while read -r path; do
            [ -e "$path" ] || { echo "::error::README links missing path: $path"; status=1; }
          done < <(grep -oP '\]\(\K[^)#][^)]*' README.md | grep -vE '^https?://' | sed 's/#.*//' | sort -u)
          exit $status
