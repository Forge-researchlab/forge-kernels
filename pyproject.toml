[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-kernels"
version = "0.0.1.dev1"
description = "Fused Triton kernels for LLM fine-tuning, with a patching layer for Hugging Face Qwen and Gemma models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<2",
    # A runtime dependency, not a build one: triton 3.0's CUDA driver imports
    # setuptools from triton/runtime/build.py when it compiles a launcher, so
    # dropping it makes every kernel fail at import with ModuleNotFoundError.
    "setuptools>=42",
    "torch>=2.4,<2.5",
    # Upper bound is load-bearing, not caution. transformers 5.x requires
    # torch>=2.5, and against the torch pin above it does not fail loudly: it
    # disables its torch backend and every AutoModel call then raises "requires
    # the PyTorch library but it was not found".
    "transformers>=4.40,<5",
    "triton>=3.0,<3.1",
]

[project.optional-dependencies]
# forge/demos/ trains a real model and plots the curves.
demos = [
    "matplotlib>=3.8",
    "peft>=0.11",
]
# The benchmarks compare against Liger, which is not needed to use the kernels.
bench = [
    "liger-kernel>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/Forge-researchlab/forge-kernels"
Issues = "https://github.com/Forge-researchlab/forge-kernels/issues"

# The distribution spans two source roots. `forge` is the public API and lives in
# forge/forge/; the kernels it calls live in kernels/ at the repository root and
# are imported as `kernels.<name>...`. Both have to ship or `import forge` fails
# outside a checkout, which is what it used to do.
[tool.setuptools]
package-dir = { forge = "forge/forge", kernels = "kernels" }

# Listed rather than auto-discovered: most of kernels/ predates any packaging and
# has no __init__.py, so setuptools' finder needs namespace discovery, which then
# also matches forge/ from the second source root and makes the mapping above
# ambiguous. The structure CI job checks this list against the tree, so a new
# kernel that is not declared here fails CI rather than shipping broken.
packages = [
    "forge",
    "forge.kernels",
    "forge.patching",
    "forge.patching.kernels",
    "kernels",
    "kernels.cross_entropy",
    "kernels.cross_entropy.benchmarks",
    "kernels.cross_entropy.experiments",
    "kernels.cross_entropy.experiments.v1",
    "kernels.cross_entropy.experiments.v2",
    "kernels.cross_entropy.tests",
    "kernels.embedding",
    "kernels.embedding.benchmarks",
    "kernels.embedding.experiments",
    "kernels.embedding.experiments.v1",
    "kernels.embedding.reference",
    "kernels.embedding.reference.liger",
    "kernels.embedding.tests",
    "kernels.geglu",
    "kernels.geglu.benchmarks",
    "kernels.layernorm",
    "kernels.lora_mlp",
    "kernels.lora_mlp.benchmarks",
    "kernels.lora_mlp.docs",
    "kernels.lora_mlp.docs.artifacts",
    "kernels.lora_mlp.docs.artifacts.liger_kernel",
    "kernels.lora_mlp.docs.artifacts.unsloth",
    "kernels.lora_mlp.experiments",
    "kernels.lora_mlp.experiments.v1",
    "kernels.lora_mlp.experiments.v2",
    "kernels.lora_mlp.experiments.v3",
    "kernels.lora_mlp.experiments.v4",
    "kernels.lora_mlp.experiments.v5",
    "kernels.lora_mlp.experiments.v6",
    "kernels.lora_mlp.reference",
    "kernels.lora_mlp.tests",
    "kernels.lora_qkv",
    "kernels.lora_qkv.benchmarks",
    "kernels.lora_qkv.docs",
    "kernels.lora_qkv.docs.artifacts",
    "kernels.lora_qkv.docs.artifacts.liger_kernel",
    "kernels.lora_qkv.docs.artifacts.unsloth",
    "kernels.lora_qkv.experiments",
    "kernels.lora_qkv.experiments.v1",
    "kernels.lora_qkv.experiments.v2",
    "kernels.lora_qkv.experiments.v3",
    "kernels.lora_qkv.experiments.v4",
    "kernels.lora_qkv.reference",
    "kernels.lora_qkv.tests",
    "kernels.rmsnorm",
    "kernels.rmsnorm.baselines",
    "kernels.rmsnorm.baselines.liger",
    "kernels.rmsnorm.baselines.unsloth",
    "kernels.rmsnorm.benchmarks",
    "kernels.rmsnorm.tests",
    "kernels.rope",
    "kernels.rope.baselines",
    "kernels.rope.baselines.liger",
    "kernels.rope.baselines.unsloth",
    "kernels.rope.benchmarks",
    "kernels.rope.tests",
    "kernels.swiglu",
    "kernels.swiglu.benchmarks",
]

[dependency-groups]
dev = [
    "liger-kernel>=0.8.0",
    "matplotlib>=3.8",
    "peft>=0.11",
    "pytest>=7.1.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: larger GPU correctness cases that are useful before benchmarking",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    # Vendored Unsloth and Liger sources kept verbatim for comparison. Their
    # style is not ours to change, and reformatting them would destroy the
    # diffability that makes them useful as references.
    "kernels/*/docs/artifacts",
    "kernels/*/reference",
]

[tool.ruff.lint]
# Deliberately narrow. The tree carries ~700 stylistic findings inherited from
# notebook-derived benchmark scripts, and mass-reformatting them would bury the
# per-version kernel history that docs/analysis/ refers to. What is enforced
# here is the subset that catches genuine breakage: syntax errors, undefined
# names, and comparison mistakes. Widen it per-directory as files get cleaned.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.ruff.lint.per-file-ignores]
# `del params, X` at the end of run_config frees benchmark memory, after which
# ruff treats every closure reference to those names as possibly-unbound. The
# closures all run before the del.
"kernels/lora_mlp/benchmarks/bench_memory.py" = ["F821"]
